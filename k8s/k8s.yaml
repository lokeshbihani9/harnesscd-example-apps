apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  namespace: {{ .Values.namespace }}
  labels:
    app: rest-api
    team: cds
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: rest-api
  template:
    metadata:
      labels:
        app: rest-api
        team: cds
    spec:
      imagePullSecrets:
      - name: {{ .Values.dockerconfigjson }}
      containers:
      - name: rest-api
        image: {{ .Values.image }}
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: rest-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: rest-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
