apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  namespace: lbihani9
  labels:
    app: rest-api
    team: cd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-api
  template:
    metadata:
      labels:
        app: rest-api
        team: cd
    spec:
      containers:
      - name: rest-api
        image: {{ .Values.image }}
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: rest-api
  namespace: lbihani9
spec:
  selector:
    app: rest-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
